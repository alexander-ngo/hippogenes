[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hippogenes"
version = "0.1.0"
description = "Toolbox and repository for vertex-wise mapping of hippocampal gene expression"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Alexander Ngo"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
docs = [
    "sphinx==7.1.2",
    "sphinx-rtd-theme==1.3.0",
    "sphinx-design==0.5.0",
    "sphinx-copybutton==0.5.2",
    "nbsphinx>=0.9",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/alexander-ngo/hippogenes"
Documentation = "https://hippogenes.readthedocs.io"
Issues = "https://github.com/alexander-ngo/hippogenes/issues"

[tool.setuptools]
packages = ["hippogenes"]
